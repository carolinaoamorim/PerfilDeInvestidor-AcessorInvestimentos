spring.application.name=perfil-investidor

# PostgreSQL próprio do Serviço de Perfil
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/investor_profile}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O schema é criado pelas migrations do Flyway; o Hibernate só confere se bate com as entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.exchange=investment.events
app.rabbitmq.routing-keys.profile-updated=profile.updated
